<title>Pong has moved</title>
<script>
// Pong moved from /pong-game/ to /ari/arcade/pong.html. Keep the rest of the address (page, ?query, #hash).
(function () {
  var oldBase = "/pong-game/", newBase = "/ari/arcade/pong.html", keepPath = false;
  var p = location.pathname, rest = "";
  if (keepPath && p.indexOf(oldBase) === 0) rest = p.slice(oldBase.length).replace(/^index\.html$/, "");
  location.replace(newBase + rest + location.search + location.hash);
})();
</script>
