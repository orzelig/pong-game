<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="controls">
            <div class="control-group">
                <h3>Player 1</h3>
                <p><span class="key">W</span> Move Up</p>
                <p><span class="key">S</span> Move Down</p>
            </div>
            <div class="control-group">
                <h3>Game</h3>
                <p><span class="key">1</span> Single Player</p>
                <p><span class="key">2</span> Two Players</p>
                <p><span class="key">Space</span> Start/Pause</p>
                <p><span class="key">R</span> Reset</p>
            </div>
            <div class="control-group">
                <h3>Player 2</h3>
                <p><span class="key">↑</span> Move Up</p>
                <p><span class="key">↓</span> Move Down</p>
            </div>
        </div>
    </div>

    <script src="js/paddle.js"></script>
    <script src="js/ball.js"></script>
    <script src="js/input.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
